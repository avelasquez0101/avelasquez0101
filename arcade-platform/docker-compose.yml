version: '3.8'
services:
  # Backend Services
  auth-service:
    build: ./services/auth
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/auth_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - PORT=3001
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./services/auth:/app
      - /app/node_modules

  tournament-service:
    build: ./services/tournament
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/tournament_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PORT=3002
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./services/tournament:/app
      - /app/node_modules

  shop-service:
    build: ./services/shop
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/shop_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PROFILE_SERVICE_URL=http://profile-service:3004
      - PORT=3003
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./services/shop:/app
      - /app/node_modules

  profile-service:
    build: ./services/profile
    ports:
      - "3004:3004"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/profile_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PORT=3004
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./services/profile:/app
      - /app/node_modules

  notification-service:
    build: ./services/notification
    ports:
      - "3005:3005"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - PORT=3005
    depends_on:
      - rabbitmq
    volumes:
      - ./services/notification:/app
      - /app/node_modules

  admin-service:
    build: ./services/admin
    ports:
      - "3006:3006"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/admin_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PORT=3006
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./services/admin:/app
      - /app/node_modules

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    depends_on:
      - auth-service
      - tournament-service
      - shop-service
      - profile-service

  # Databases
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: arcade_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # API Gateway
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service
      - tournament-service
      - shop-service
      - profile-service
      - admin-service
      - frontend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
