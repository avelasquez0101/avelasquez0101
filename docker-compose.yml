version: '3.8'

services:
  # ===========================
  # BASE DE DATOS Y SERVICIOS
  # ===========================
  
  postgres:
    image: postgres:15-alpine
    container_name: arcade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: main
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arcade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arcade-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - arcade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: arcade-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    networks:
      - arcade-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===========================
  # MICROSERVICIOS BACKEND
  # ===========================

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: arcade-auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:pass@postgres:5432/auth_db?schema=public
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=dev-secret-change-in-production
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arcade-network
    volumes:
      - ./services/auth/src:/app/src
      - ./services/auth/logs:/app/logs

  tournament-service:
    build:
      context: ./services/tournament
      dockerfile: Dockerfile
    container_name: arcade-tournament-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:pass@postgres:5432/tournament_db?schema=public
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - PROFILE_SERVICE_URL=http://profile-service:3004
      - ADMIN_API_KEY=admin-secret-key-change-in-production
      - LOG_LEVEL=debug
      - CORS_ORIGIN=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - arcade-network
    volumes:
      - ./services/tournament/src:/app/src
      - ./services/tournament/logs:/app/logs

  # ===========================
  # API GATEWAY
  # ===========================

  nginx:
    image: nginx:alpine
    container_name: arcade-api-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - tournament-service
    networks:
      - arcade-network

networks:
  arcade-network:
    driver: bridge

volumes:
  postgres_data:
