version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chgaming_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chgaming
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chgaming_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chgaming"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chgaming_redis
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chgaming_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: chgaming_server
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chgaming
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      JWT_SECRET: your-super-secret-jwt-key-change-in-production-2024
      JWT_EXPIRES_IN: 1h
      PAYPAL_CLIENT_ID: sandbox_client_id
      PAYPAL_CLIENT_SECRET: sandbox_client_secret
      PAYPAL_API_URL: https://api-m.sandbox.paypal.com
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chgaming_network
    command: sh -c "sleep 15 && node packages/server/src/index.js"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: chgaming_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NODE_ENV: development
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - chgaming_network

volumes:
  postgres_data:
  redis_data:

networks:
  chgaming_network:
    driver: bridge
